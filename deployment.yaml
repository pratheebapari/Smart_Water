apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-water
  labels:
    app: smart-water
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: smart-water
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smart-water
    spec:
      containers:
        - name: smart-water
          image: pratheebapari/smart-water:IMAGE_TAG
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: smart-water-service
spec:
  type: NodePort
  selector:
    app: smart-water
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30100